[package]
name = "sprite-sheet-packer"
version = "1.0.0"
description = "Sprite Sheet Packer — pack image frames into sprite sheets"
authors = ["Mike Leone"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "sprite_sheet_packer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
